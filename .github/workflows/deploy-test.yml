# .github/workflows/deploy-test.yml
# 'test' 브랜치를 AWS Amplify로 배포하기 위한 파일 (표준 자격증명 방식)

name: Deploy TEST Branch to Amplify

# 1. 언제 실행할까?
on:
  push:
    branches: ["test"]
  pull_request:
    branches: ["test"]

jobs:
  build:
    name: react build & deploy to amplify
    runs-on: ubuntu-latest
    
    steps:
      # 2. 코드 가져오기
      - name: checkout Github Action
        uses: actions/checkout@v3

      # 3. .env 파일 생성
      - name: .env setting
        run: |
          echo "REACT_APP_KAKAO_MAP_KEY=${{ secrets.REACT_APP_KAKAO_MAP_KEY }}" >> .env
          echo "REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}" >> .env
          echo "REACT_APP_KAKAO_CLIENT_ID=${{ secrets.REACT_APP_KAKAO_CLIENT_ID }}" >> .env
          echo "REACT_APP_KAKAO_REDIRECT_URI=${{ secrets.REACT_APP_KAKAO_REDIRECT_URI }}" >> .env
 
      # 4. 의존성 설치
      - name: Install dependencies
        run: npm ci
      
      # 5. 린트 실행
      - name: Run Lint
        run: npm run lint

      # 6. React 앱 빌드
      - name: Build
        run: CI=false npm run build

      # 7. 🚀 AWS 자격 증명 설정 (표준 방식)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.TEST_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TEST_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Amplify 앱이 있는 리전

# 8. 🚀 (수정됨) AWS Amplify로 수동 배포 (zip 명령어 수정)
      - name: Deploy to AWS Amplify
        run: |
          # (1/4) zip, jq 설치 (동일)
          sudo apt-get update && sudo apt-get install -y zip jq

          # (2/4) 🚨 (수정됨) 빌드 폴더 *내용물*을 압축
          echo "Zipping build folder contents..."
          cd build
          zip -r ../build.zip .
          cd ..

          # (3/4) Amplify에 배포 슬롯 생성 (동일)
          echo "Creating deployment slot..."
          DEPLOY_DATA=$(aws amplify create-deployment \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --branch-name test)
          
          # JSON에서 Job ID와 업로드 URL 추출
          JOB_ID=$(echo $DEPLOY_DATA | jq -r .jobId)
          UPLOAD_URL=$(echo $DEPLOY_DATA | jq -r .zipUploadUrl)

          echo "JOB_ID: $JOB_ID"

          # (4/4) zip 파일을 S3 업로드 URL로 전송 (동일)
          echo "Uploading zip file..."
          curl -X PUT -H "Content-Type: application/zip" \
            --upload-file build.zip "$UPLOAD_URL"

          # (5/4) Amplify 배포 시작 (동일)
          echo "Starting deployment..."
          aws amplify start-deployment \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --branch-name test \
            --job-id $JOB_ID