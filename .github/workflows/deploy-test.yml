# .github/workflows/deploy-test.yml
# 'test' 브랜치를 AWS Amplify로 배포하기 위한 파일 (표준 자격증명 방식)

name: Deploy TEST Branch to Amplify

# 1. 언제 실행할까?
on:
  push:
    branches: ["test"]
  pull_request:
    branches: ["test"]

jobs:
  build:
    name: react build & deploy to amplify
    runs-on: ubuntu-latest
    
    steps:
      # 2. 코드 가져오기
      - name: checkout Github Action
        uses: actions/checkout@v3

      # 3. .env 파일 생성
      - name: .env setting
        run: |
          echo "PUBLIC_URL=${{ secrets.PUBLIC_URL }}" >> .env
          echo "REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}" >> .env
          echo "REACT_APP_KAKAO_CLIENT_ID=${{ secrets.REACT_APP_KAKAO_CLIENT_ID }}" >> .env
          echo "REACT_APP_KAKAO_REDIRECT_URI=${{ secrets.REACT_APP_KAKAO_REDIRECT_URI }}" >> .env
 
      # 4. 의존성 설치
      - name: Install dependencies
        run: npm ci
      
      # 5. 린트 실행
      - name: Run Lint
        run: npm run lint

      # 6. React 앱 빌드
      - name: Build
        run: CI=false npm run build

      # 7. 🚀 AWS 자격 증명 설정 (수정된 표준 방식)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.TEST_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TEST_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Amplify 앱이 있는 리전

      # 8. 🚀 AWS Amplify로 배포
      # (이전 단계에서 자격 증명이 이미 설정되었으므로 env: 부분이 필요 없습니다.)
      - name: Deploy to AWS Amplify
        uses: aws-actions/amplify-hosting-deploy@v1
        with:
          app-id: ${{ secrets.AMPLIFY_APP_ID }} 
          env-name: test 
          app-build-path: build 
          region: us-east-1