name: CI (v2.0.0 develop)

on:
  push:
    branches: ["v2/develop"]
  pull_request:
    branches: ["v2/develop"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Build (validation)
        run: CI=false npm run build